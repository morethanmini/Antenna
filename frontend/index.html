<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANTENNA</title>
    <!-- Pretendard Variable — --sans 가 1순위로 지정한 폰트인데 아무 데서도
         불러오지 않아, 한글이 시스템 폰트의 400/700 두 단계로만 렌더되고 있었다.
         굵기 45~920 가변이라 CSS 곳곳의 650·750·850 이 제대로 표현된다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <!-- Nanum Pen Script — 모의투자 홈(G-01)의 손글씨 한 줄("가상으로 시작하는 진짜 투자 감각")에만 쓴다.
         본문 서체가 아니라 display=swap 으로 늦게 와도 화면이 멈추지 않는다.

         IBM Plex Mono — --mono 가 1순위로 지정한 폰트인데 Pretendard 와 똑같이
         아무 데서도 불러오지 않고 있었다(QA 09-21 "글꼴이 화면마다 다르다").
         해시·지갑 주소·코드 배지 26곳이 쓰는데, 없으면 ui-monospace 로 떨어져
         macOS 는 SF Mono, Windows 는 Consolas 로 기기마다 다른 서체가 나왔다.
         CSS 가 쓰는 굵기가 600~850 이라 400~700 을 받는다(850 은 700 으로 맞는다). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
